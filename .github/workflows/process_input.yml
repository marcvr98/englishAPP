name: Procesar expresiones

on:
  schedule:
    - cron: "0 21 * * *"  # 21:00 UTC → 22:00/23:00 hora española según DST
  workflow_dispatch:       # para poder lanzarlo a mano cuando quieras

permissions:
  contents: write
  issues: write

jobs:
  procesar:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Procesar frases pendientes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python procesar.py

      - name: Commit y push del resultado
        run: |
          git config user.name "c2-bot"
          git config user.email "c2-bot@users.noreply.github.com"
          git add data/expresiones.json
          git diff --cached --quiet || git commit -m "Nuevas expresiones procesadas"
          git push